  给 AI 一双只在自己地盘上动手的手：受限读写、自动备份、语法检查与回滚，所有改动都进账本。

  ⚠️ **推荐与「溟汐的考核」(astrbot_plugin_moon_gate) 一起安装**：
  单独安装时读写、备份、沙箱都能用，但没有积分与提权，AI 无法凭劳动换取更高权限。
  考核地址：https://github.com/seek9527-open/astrbot_plugin_moon_gate
